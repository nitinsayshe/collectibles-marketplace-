# Render Blueprint — deploys the NestJS API as a Web Service.
# In Render: New + -> Blueprint -> pick this repo -> Render finds this file automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: marketplace-backend
    runtime: node
    rootDir: marketplace-backend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # MongoDB Atlas connection string — create the cluster first, then paste it here.
      - key: MONGODB_URI
        sync: false
      # Auto-generated by Render; no need to set manually.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # The deployed Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
      # From your Cloudinary dashboard (cloudinary.com/console) — used for product/avatar image uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

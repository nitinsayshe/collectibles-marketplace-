# Render Blueprint — deploys the NestJS API as a Web Service.
# In Render: New + -> Blueprint -> pick this repo -> Render finds this file automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: marketplace-backend
    runtime: node
    rootDir: marketplace-backend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # MongoDB Atlas connection string — create the cluster first, then paste it here.
      - key: MONGODB_URI
        sync: false
      # Auto-generated by Render; no need to set manually.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # The deployed Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
      # This service's own public URL, e.g. https://marketplace-backend.onrender.com
      # (Render assigns it on first deploy — copy it in from the service's dashboard page.)
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must exactly match BACKEND_PUBLIC_URL + /api/google-drive/callback,
      # and must be registered in Google Cloud Console -> Credentials -> Authorized redirect URIs.
      - key: GOOGLE_DRIVE_REDIRECT_URI
        sync: false
      # Auto-generated by Render; no need to set manually.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
